[project]
name = "diddi-review-runner"
version = "0.1.0"
description = "Contract-driven DiddiGo/DiddiSend/DiddiFood review journey runner"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "PyJWT[crypto]>=2.9,<3",
  "uvicorn[standard]>=0.32,<1",
  "redis>=5.2,<6",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "respx>=0.21,<1", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
