services:
  runner:
    build: .
    ports: ["8000:8000"]
    environment:
      APP_ENV: staging
      SERVICE_NAME: diddi-review-runner
      DIDDIFREEID_BASE_URL: https://auth-staging.diddifree.com
      DIDDIGO_BASE_URL: https://go-staging.diddifree.com
      DIDDISEND_BASE_URL: https://diddisend-api-staging.diddifree.com
      DIDDIFOOD_BASE_URL: https://diddifood-backend-staging.diddifree.com
      DIDDIFREEID_ISSUER: https://auth-staging.diddifree.com
      DIDDIFREEID_AUDIENCE: diddi-services
      DIDDIFREEID_JWKS_URL: https://auth-staging.diddifree.com/.well-known/jwks.json
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://runner:runner@postgres:5432/review_runner
      JWT_ALGORITHMS: RS256
      HTTP_TIMEOUT_SECONDS: 15
      STREAM_NAME: ${STREAM_NAME:-diddi-review-runs}
      REACTIVE_ENABLED: "true"
      REACTIVE_POLL_INTERVAL_SECONDS: 3
      # Full six-binding review roster (Go/Send/Food, both sides). Without this the
      # app falls back to a Go-only roster built from the DIDDIGO_* vars below.
      REVIEW_ACCOUNTS_JSON: ${REVIEW_ACCOUNTS_JSON:-[]}
      REQUEST_PICKUP_LAT: ${REQUEST_PICKUP_LAT:-5.3599}
      REQUEST_PICKUP_LNG: ${REQUEST_PICKUP_LNG:--4.0083}
      REQUEST_PICKUP_ADDRESS: ${REQUEST_PICKUP_ADDRESS:-Plateau, Abidjan}
      REQUEST_DROPOFF_LAT: ${REQUEST_DROPOFF_LAT:-5.3760}
      REQUEST_DROPOFF_LNG: ${REQUEST_DROPOFF_LNG:--3.9876}
      REQUEST_DROPOFF_ADDRESS: ${REQUEST_DROPOFF_ADDRESS:-Cocody, Abidjan}
      DIDDIGO_PASSENGER_USER_ID: ${DIDDIGO_PASSENGER_USER_ID:?Set passenger user id in Portainer}
      DIDDIGO_PASSENGER_EMAIL: ${DIDDIGO_PASSENGER_EMAIL:?Set passenger email in Portainer}
      DIDDIGO_PASSENGER_OTP: ${DIDDIGO_PASSENGER_OTP:?Set passenger OTP in Portainer}
      DIDDIGO_DRIVER_USER_ID: ${DIDDIGO_DRIVER_USER_ID:?Set driver user id in Portainer}
      DIDDIGO_DRIVER_EMAIL: ${DIDDIGO_DRIVER_EMAIL:?Set driver email in Portainer}
      DIDDIGO_DRIVER_OTP: ${DIDDIGO_DRIVER_OTP:?Set driver OTP in Portainer}
    depends_on: [redis, postgres]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: runner
      POSTGRES_PASSWORD: runner
      POSTGRES_DB: review_runner
    # Not published on the host: the runner reaches it in-network as "postgres".
    # (Publishing 5432 collided with another Postgres already on the host.)
  redis:
    image: redis:7-alpine
    # Not published on the host: reached in-network as "redis".

# The host's default Docker address pools (172.16.0.0/12 and 192.168.0.0/16) are
# fully subnetted, so Docker cannot auto-allocate a new network. Pin this stack to
# a slice of the still-free 172.16.0.0/16 block instead.
networks:
  default:
    ipam:
      config:
        - subnet: 172.16.240.0/24
